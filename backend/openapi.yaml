openapi: 3.0.3
info:
  title: BRSE Interview AI Gateway
  version: 0.1.0
  description: Guest ephemeral capabilities; no learner signup/login. Synchronous text assessment, no server transcript persistence.
paths:
  /api/v1/system/provider-capabilities:
    get:
      summary: Read configured availability and media gates (not a live provider health test)
      responses:
        '200':
          description: Availability/model/TTL; external media capabilities false
  /api/v1/ai/interviews:
    post:
      summary: Create a 15-minute capability after explicit consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [track, rubricVersion, consent]
              properties:
                track: {type: string, enum: [JOB, BRSE]}
                rubricVersion: {type: string, enum: [job-text-v1, brse-text-v1]}
                consent: {type: boolean, enum: [true]}
      responses:
        '201':
          description: Capability issued (token must never be persisted or placed in URLs)
          content:
            application/json:
              schema:
                type: object
                required: [id, capabilityToken, expiresAt]
                properties:
                  id: {type: string, format: uuid}
                  capabilityToken: {type: string}
                  expiresAt: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/ai/interviews/{id}/feedback:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: Validate model feedback against exact candidate evidence
      security: [{Capability: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [questionId, mode, utteranceId, transcriptVersion, text, endMs]
              properties:
                questionId: {type: string, maxLength: 50}
                mode: {type: string, enum: [INITIAL, GUIDED, INDEPENDENT]}
                utteranceId: {type: string, format: uuid}
                transcriptVersion: {type: integer, minimum: 1, maximum: 30}
                text: {type: string, minLength: 1, maxLength: 10000}
                endMs: {type: integer, minimum: 0, maximum: 604800000, description: Whole-answer composition interval, never audio timing}
      responses:
        '200':
          description: Normalized model assessment with rubric/utterance/version and exact evidence (source AI_MODEL)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feedback'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '502': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/ai/interviews/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      summary: Revoke a capability
      security: [{Capability: []}]
      responses:
        '204': {description: Revoked}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/dictionary/words:
    get:
      summary: Short-phrase words JSON lookup with authored fallback (no scraping/media/cache)
      description: Exactly one q parameter; no context/transcript/CV fields. Operator flag defaults disabled. Browser consent is required by the UI before an online request.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 50}
          description: NFC short phrase, max 50 Unicode code points; no control/format/surrogate/newline characters
      responses:
        '200':
          description: Results or explicit provider/fallback state; no raw upstream response or media
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DictionaryLookup'}
        '400': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    Capability: {type: http, scheme: bearer, description: Random ephemeral capability; not a learner account token}
  responses:
    Problem:
      description: Sanitized error; also 403 ORIGIN_DENIED or 413 PAYLOAD_TOO_LARGE at request boundary
      content:
        application/problem+json:
          schema:
            type: object
            required: [status, title, code]
            properties:
              status: {type: integer}
              title: {type: string}
              code: {type: string}
              detail: {type: string}
              traceId: {type: string}
  schemas:
    DictionaryLookup:
      type: object
      required: [query, state, entries, capabilities]
      properties:
        query: {type: string}
        state: {type: string, enum: [RESULTS, NO_RESULTS, PROVIDER_DISABLED, PROVIDER_UNAVAILABLE, SCHEMA_MISMATCH, RATE_LIMITED]}
        capabilities:
          type: object
          properties:
            kanjiScraping: {type: boolean, enum: [false]}
            sentenceScraping: {type: boolean, enum: [false]}
            externalMedia: {type: boolean, enum: [false]}
        entries:
          type: array
          maxItems: 10
          items:
            type: object
            required: [id, term, reading, senses, source, sourceUrl, businessExample, usageNote, rights]
            properties:
              id: {type: string}
              term: {type: string}
              reading: {type: string, nullable: true}
              senses: {type: array, minItems: 1, maxItems: 5, items: {type: string}}
              source: {type: string, enum: [AUTHOR_CREATED, JISHO_JSON]}
              sourceUrl: {type: string, nullable: true, description: Server-constructed HTTPS Jisho search URL or null for authored content}
              businessExample: {type: string, nullable: true, description: First-party authored only; null for Jisho}
              usageNote: {type: string, nullable: true, description: First-party authored only; null for Jisho}
              rights: {type: string, enum: [FIRST_PARTY, EXTERNAL_LOOKUP_NO_CACHE]}
    Evidence:
      type: object
      required: [id, criterionId, utteranceId, transcriptVersion, quote, startOffset, endOffset, startMs, endMs, reason, suggestion, certainty]
      properties:
        id: {type: string, format: uuid}
        criterionId: {type: string}
        utteranceId: {type: string, format: uuid}
        transcriptVersion: {type: integer}
        quote: {type: string}
        startOffset: {type: integer, description: UTF-16 index computed by server}
        endOffset: {type: integer}
        startMs: {type: integer, enum: [0]}
        endMs: {type: integer}
        reason: {type: string}
        suggestion: {type: string}
        certainty: {type: string, enum: [MODEL_ASSESSMENT]}
    Feedback:
      type: object
      required: [source, provider, model, rubricVersion, utteranceId, transcriptVersion, criteria, followUp, limitation]
      properties:
        source: {type: string, enum: [AI_MODEL]}
        provider: {type: string, enum: [openai]}
        model: {type: string}
        rubricVersion: {type: string}
        utteranceId: {type: string, format: uuid}
        transcriptVersion: {type: integer}
        limitation: {type: string}
        criteria:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            required: [criterionId, score, annotations]
            properties:
              criterionId: {type: string}
              score: {type: integer, minimum: 0, maximum: 3, nullable: true}
              annotations:
                type: array
                maxItems: 3
                items: {$ref: '#/components/schemas/Evidence'}
        followUp:
          type: object
          nullable: true
          required: [question, quote, reason]
          properties:
            question: {type: string}
            quote: {type: string}
            reason: {type: string}
