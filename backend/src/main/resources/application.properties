server.address=${BRSE_API_ADDRESS:127.0.0.1}
server.port=${BRSE_API_PORT:8080}
spring.application.name=brse-trainer-api
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-swallow-size=64KB
server.tomcat.max-http-form-post-size=64KB
spring.mvc.log-request-details=false
brse.ai.enabled=${BRSE_AI_ENABLED:false}
brse.ai.key=${BRSE_AI_KEY:}
brse.ai.model=${BRSE_AI_MODEL:}
logging.level.org.springframework.web=INFO

brse.api.allowed-origin=${BRSE_ALLOWED_ORIGIN:}

brse.jisho.enabled=${BRSE_JISHO_ENABLED:false}
